<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>古着AIリサーチ＆出品PRO</title>
  <style>
    :root {
      --bg-main: #0b1329;
      --card-bg: #162033;
      --card-border: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-blue: #0284c7;
      --mercari: #ea580c;
      --yahoo-furima: #c026d3;
      --yahoo-auc: #ca8a04;
      --del-red: #ef4444;
      --success-green: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 14px;
      line-height: 1.5;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      text-align: center;
      padding: 6px 0;
    }
    header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    header p {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .api-row {
      display: flex;
      gap: 6px;
    }
    .input-field {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
    }
    .input-field:focus {
      border-color: #38bdf8;
    }

    .select-field {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.2s;
    }
    .btn:active {
      opacity: 0.8;
    }
    .btn-primary { background: #0284c7; }
    .btn-mercari { background: var(--mercari); }
    .btn-yfurima { background: var(--yahoo-furima); }
    .btn-yauc { background: var(--yahoo-auc); }
    .btn-clear { background: #334155; font-size: 0.75rem; padding: 6px 10px; width: auto; border: none; border-radius: 6px; color: #fff; cursor: pointer; }
    .btn-del { background: #7f1d1d; color: #fca5a5; font-size: 0.75rem; padding: 6px 10px; width: auto; border: none; border-radius: 6px; cursor: pointer; }

    .file-upload-box {
      border: 2px dashed #334155;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      background: #090e1a;
      cursor: pointer;
    }
    .file-upload-box input {
      display: none;
    }
    .file-upload-label {
      font-size: 0.8rem;
      color: #94a3b8;
      cursor: pointer;
    }

    .preview-container {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 6px 0;
    }
    .thumb-wrapper {
      position: relative;
      width: 64px;
      height: 64px;
      flex-shrink: 0;
    }
    .preview-thumb {
      width: 100%;
      height: 100%;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid #334155;
    }
    .thumb-del-btn {
      position: absolute;
      top: -5px;
      right: -5px;
      width: 18px;
      height: 18px;
      background: var(--del-red);
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      cursor: pointer;
      border: 1px solid #fff;
    }

    .log-box {
      background: #090e1a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.75rem;
      color: #94a3b8;
      font-family: monospace;
      min-height: 40px;
      white-space: pre-wrap;
    }

    .result-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .price-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }
    .price-card {
      background: #090e1a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px 6px;
      text-align: center;
    }
    .price-card .title {
      font-size: 0.68rem;
      color: #94a3b8;
      margin-bottom: 2px;
    }
    .price-card .val {
      font-size: 0.8rem;
      font-weight: 700;
      color: #38bdf8;
    }

    .output-area {
      width: 100%;
      background: #090e1a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      padding: 10px;
      font-size: 0.8rem;
      line-height: 1.5;
      resize: vertical;
      min-height: 130px;
      outline: none;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>👕 古着AIリサーチ＆出品PRO</h1>
    <p>画像鑑定・市場査定・メルカリ出品文即時生成</p>
  </header>

  <!-- 1. API設定 -->
  <section class="card">
    <div class="card-title">
      <span>🔑 Gemini API設定</span>
      <button class="btn-clear" onclick="toggleApiSettings()">設定を開く</button>
    </div>
    <div id="apiBox" style="display: none;" class="api-row">
      <input type="text" id="apiKey" class="input-field" placeholder="Gemini APIキーを入力">
      <button class="btn btn-primary" style="width: 80px;" onclick="saveApiKey()">保存</button>
    </div>
  </section>

  <!-- 2. 画像撮影・選択 -->
  <section class="card">
    <div class="card-title">
      <span>📸 商品画像の選択 (最大4枚)</span>
      <button id="clearPhotosBtn" class="btn-del" style="display: none;" onclick="clearAllPhotos()">全消去</button>
    </div>

    <div class="file-upload-box" onclick="document.getElementById('imgInput').click()">
      <div class="file-upload-label">
        <span style="font-size: 1.2rem;">📷</span><br>
        タップして写真を選択 / 撮影
      </div>
      <input type="file" id="imgInput" multiple accept="image/*" onchange="handleFiles(this.files)">
    </div>

    <div id="previewArea" class="preview-container"></div>

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <span style="font-size: 0.72rem; color: #94a3b8;">出品トーン（文体）の選択</span>
      <select id="selectedTone" class="select-field">
        <option value="親切・丁寧・誠実（万能・リピート獲得型）">親切・丁寧・誠実（万能・リピート獲得型）</option>
        <option value="シンプル・要点重視（古着好き向け・短文型）">シンプル・要点重視（古着好き向け・短文型）</option>
        <option value="ストリート・ヴィンテージ感（熱量高め・高単価型）">ストリート・ヴィンテージ感（熱量高め・高単価型）</option>
      </select>
    </div>

    <button class="btn btn-primary" onclick="runAppraisal()">
      <span>⚡ AI市場査定＆出品文を生成</span>
    </button>
  </section>

  <!-- 3. ログ表示 -->
  <div id="logBox" class="log-box">待機中...</div>

  <!-- 4. 査定結果カード -->
  <section class="card result-section" id="resultCard" style="display: none;">
    <div class="card-title">
      <span>📊 市場査定データ</span>
      <span id="detectedBrand" style="color: #38bdf8; font-size: 0.8rem;"></span>
    </div>

    <div id="detectedFeatures" style="font-size: 0.78rem; color: #cbd5e1; background: #090e1a; padding: 8px; border-radius: 6px;"></div>

    <div class="price-grid">
      <div class="price-card">
        <div class="title">メルカリ相場</div>
        <div class="val" id="priceMercari">-</div>
      </div>
      <div class="price-card">
        <div class="title">Yahoo!フリマ</div>
        <div class="val" id="priceYfurima">-</div>
      </div>
      <div class="price-card">
        <div class="title">ヤフオク相場</div>
        <div class="val" id="priceYauc">-</div>
      </div>
    </div>

    <div style="font-size: 0.72rem; color: #94a3b8; display: flex; justify-content: space-between;">
      <span>推奨送料: <b id="shippingVal" style="color:#fff;">-</b></span>
      <span>検索ワード: <b id="searchKwVal" style="color:#38bdf8;">-</b></span>
    </div>

    <!-- 直結ボタン -->
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;">
      <button class="btn btn-mercari" style="padding: 8px; font-size: 0.75rem;" onclick="openSearch('mercari')">メルカリ</button>
      <button class="btn btn-yfurima" style="padding: 8px; font-size: 0.75rem;" onclick="openSearch('yfurima')">Y!フリマ</button>
      <button class="btn btn-yauc" style="padding: 8px; font-size: 0.75rem;" onclick="openSearch('yauc')">ヤフオク</button>
    </div>

    <!-- 出品用タイトル -->
    <div style="display: flex; flex-direction: column; gap: 4px; margin-top: 6px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 0.72rem; color: #94a3b8;">メルカリ推奨タイトル</span>
        <button class="btn-clear" onclick="copyText('titleOutput')">タイトルをコピー</button>
      </div>
      <input type="text" id="titleOutput" class="input-field" readonly>
    </div>

    <!-- 出品用本文（ハッシュタグ含む） -->
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 0.72rem; color: #94a3b8;">メルカリ商品説明文（タグ付き）</span>
        <button class="btn-clear" onclick="copyText('descOutput')">本文をコピー</button>
      </div>
      <textarea id="descOutput" class="output-area"></textarea>
    </div>
  </section>
</div>

<script>
  let selectedFiles = [];
  let currentSearchKw = '';

  function log(msg) {
    const box = document.getElementById('logBox');
    box.innerText = msg;
  }

  function getSavedApiKey() {
    return localStorage.getItem('furugi_gemini_key') || 
           localStorage.getItem('gemini_api_key') || 
           localStorage.getItem('apiKey') || '';
  }

  window.addEventListener('DOMContentLoaded', () => {
    const key = getSavedApiKey();
    if (key) document.getElementById('apiKey').value = key;
  });

  function toggleApiSettings() {
    const box = document.getElementById('apiBox');
    box.style.display = box.style.display === 'none' ? 'flex' : 'none';
  }

  function saveApiKey() {
    const key = document.getElementById('apiKey').value.trim();
    if (!key) { alert('APIキーを入力してください'); return; }
    localStorage.setItem('furugi_gemini_key', key);
    localStorage.setItem('gemini_api_key', key);
    alert('APIキーを保存しました');
    document.getElementById('apiBox').style.display = 'none';
  }

  function handleFiles(files) {
    if (!files || files.length === 0) return;
    const newFiles = Array.from(files);
    selectedFiles = selectedFiles.concat(newFiles).slice(0, 4);
    renderPreviews();
    document.getElementById('imgInput').value = '';
  }

  function renderPreviews() {
    const previewArea = document.getElementById('previewArea');
    const clearBtn = document.getElementById('clearPhotosBtn');
    previewArea.innerHTML = '';

    if (selectedFiles.length === 0) {
      clearBtn.style.display = 'none';
      log('写真を選択してください');
      return;
    }

    clearBtn.style.display = 'inline-block';
    selectedFiles.forEach((file, index) => {
      const wrap = document.createElement('div');
      wrap.className = 'thumb-wrapper';

      const img = document.createElement('img');
      img.className = 'preview-thumb';
      img.src = URL.createObjectURL(file);

      const del = document.createElement('div');
      del.className = 'thumb-del-btn';
      del.innerText = '×';
      del.onclick = (e) => {
        e.stopPropagation();
        removeSinglePhoto(index);
      };

      wrap.appendChild(img);
      wrap.appendChild(del);
      previewArea.appendChild(wrap);
    });

    log(`${selectedFiles.length}枚の写真を選択中`);
  }

  function removeSinglePhoto(index) {
    selectedFiles.splice(index, 1);
    renderPreviews();
  }

  function clearAllPhotos() {
    selectedFiles = [];
    document.getElementById('imgInput').value = '';
    renderPreviews();
  }

  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 1200;
          let w = img.width;
          let h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
          resolve(dataUrl.split(',')[1]);
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function runAppraisal() {
    const apiKey = document.getElementById('apiKey').value.trim() || getSavedApiKey();
    if (!apiKey) {
      alert('Gemini APIキーを設定してください');
      document.getElementById('apiBox').style.display = 'flex';
      return;
    }

    if (!selectedFiles || selectedFiles.length === 0) {
      alert('写真が選択されていません。「ファイルを選択」から写真を指定してください');
      log('写真が未選択です');
      return;
    }

    const selectedTone = document.getElementById('selectedTone').value;
    document.getElementById('resultCard').style.display = 'none';

    try {
      const parts = [];
      const prompt = `あなたは日本のフリマアプリ（メルカリ・ヤフオク等）の古着市場に精通したプロ鑑定士およびトップセラーです。
提供された画像（全体、タグ、ディテール、ダメージ）を詳細に鑑定し、以下の査定フレームワークに従って出力してください。

【古着市場価格査定フレームワーク】
1. 基本格付け（レギュラー品の場合）：
   - ファストファッション・量産（UNIQLO, GU, H&M, ZARA等）
   - 一般スポーツ・日常カジュアル（通常Nike, 通常Adidas, Champion通常等）
   - 定番人気・アメカジ・アウトドア（通常Ralph Lauren, Patagonia, Carhartt等）
   - ハイエンド・人気ストリート（Arc'teryx, Supreme, STUSSY等）

2. 【超重要】価値跳ね上がり特例（アップサイド・トリガー）：
   通常安価なブランドやレギュラー品であっても、以下の特徴を検知した場合はプレ値・高額査定へ上方修正すること。
   - 【年代・オールドタグ】オールドGAP（白タグ・紺タグ）、銀タグNike、刺繍タグChampionなど
   - 【生産国】「Made in USA（アメリカ製）」の表記がある場合
   - 【素材・仕様】本革（リアルレザー）、ダック地、ヘビーコットン、モヘア、リバースウィーブ
   - 【人気モチーフ・型番】リバースウィーブ、開襟/オープンカラー、フェード/サンフェード、短丈ボックスシルエット
   ※もしオールドGAPなどプレ値品と判明した場合は、ブランド名を「オールドGAP」として扱うこと。

3. 送料判定（アイテム形状別）：
   - Tシャツ、薄手シャツ、薄手小物：215円（ゆうパケットポスト等）
   - パンツ、スウェット、薄手ニット：450〜520円（宅急便コンパクト等）
   - ヘビーパーカー、中綿アウター、重厚ジャケット：750〜850円（宅急便）

4. 出品説明文のトーン指示（必須）：
   商品説明文は、ユーザーが指定した以下のトーンで作成してください。
   【指定トーン: ${selectedTone}】

回答は以下のJSON形式のみを出力してください：
{
  "brand": "ブランド名（オールド判明時は「オールドGAP」等）",
  "features": "アイテム名、年代、素材、特徴、査定理由（例: 90s USA製 フェード感あり）",
  "shipping_fee": 215,
  "search_keyword": "メルカリ売り切れ検索用の的確なワード（例: NIKE 90s 銀タグ スウェット）",
  "mercari": {"min_price": 0, "max_price": 0},
  "yahooflea": {"min_price": 0, "max_price": 0},
  "yahooauc": {"min_price": 0, "max_price": 0},
  "listing_template": {
    "title": "SEOに強いメルカリ向け商品タイトル（ブランド、特徴、サイズ等を含み40文字以内）",
    "description": "指定されたトーンで書かれた商品説明文（状態、サイズ感、ディテール、実寸目安を網羅）。一番最後に、メルカリ検索露出を高めるための関連ハッシュタグ（#）を5〜8個程度、半角スペース区切りで必ず出力してください（例: #NIKE #ナイキ #スウェット #90s #USA製 #古着男子 #古着女子 #Y2K）。"
  }
}`;

      parts.push({ text: prompt });

      for (let i = 0; i < selectedFiles.length; i++) {
        log(`⏳ 画像最適化中 (${i + 1}/${selectedFiles.length})...`);
        const b64 = await compressImage(selectedFiles[i]);
        if (b64) {
          parts.push({
            inline_data: {
              mime_type: 'image/jpeg',
              data: b64
            }
          });
        }
      }

      // 安定している複数のFlashモデルで自動フォールバック
      const candidateModels = ['gemini-3.5-flash', 'gemini-3.6-flash', 'gemini-2.5-flash'];
      let resData = null;
      let lastErrMsg = '';

      for (let m = 0; m < candidateModels.length; m++) {
        const modelName = candidateModels[m];
        log(`🔍 ${modelName} でAI鑑定中...`);

        try {
          const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: parts }]
            })
          });

          if (!resp.ok) {
            const errJson = await resp.json().catch(() => null);
            const msg = errJson?.error?.message || `HTTP ${resp.status}`;
            throw new Error(msg);
          }

          const data = await resp.json();
          const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!rawText) throw new Error('AIからの応答が空でした');

          const jsonMatch = rawText.match(/\{[\s\S]*\}/);
          if (!jsonMatch) throw new Error('JSON形式の解析に失敗しました');

          resData = JSON.parse(jsonMatch[0]);
          log(`✅ ${modelName} による鑑定完了！`);
          break; // 成功したらループ終了
        } catch (e) {
          lastErrMsg = e.message;
          log(`⚠️ ${modelName} が混雑中（${e.message}）。次のモデルへ自動切替中...`);
          // 1秒待機して次を試す
          await new Promise(r => setTimeout(r, 1000));
        }
      }

      if (!resData) {
        throw new Error(lastErrMsg || '全モデルで混雑エラーが発生しました。数十秒後に再試行してください');
      }

      // 結果の画面反映
      document.getElementById('detectedBrand').innerText = resData.brand || '';
      document.getElementById('detectedFeatures').innerText = resData.features || '';
      document.getElementById('priceMercari').innerText = `¥${(resData.mercari?.min_price || 0).toLocaleString()}〜${(resData.mercari?.max_price || 0).toLocaleString()}`;
      document.getElementById('priceYfurima').innerText = `¥${(resData.yahooflea?.min_price || 0).toLocaleString()}〜${(resData.yahooflea?.max_price || 0).toLocaleString()}`;
      document.getElementById('priceYauc').innerText = `¥${(resData.yahooauc?.min_price || 0).toLocaleString()}〜${(resData.yahooauc?.max_price || 0).toLocaleString()}`;

      document.getElementById('shippingVal').innerText = `¥${resData.shipping_fee || 215}`;
      currentSearchKw = resData.search_keyword || resData.brand || '';
      document.getElementById('searchKwVal').innerText = currentSearchKw;

      document.getElementById('titleOutput').value = resData.listing_template?.title || '';
      document.getElementById('descOutput').value = resData.listing_template?.description || '';

      document.getElementById('resultCard').style.display = 'flex';
      log('✨ 査定およびハッシュタグ付き出品文の生成が完了しました！');

    } catch (err) {
      log('エラー詳細: ' + (err.message || '通信エラー'));
    }
  }

  function openSearch(platform) {
    if (!currentSearchKw) {
      alert('検索キーワードがありません');
      return;
    }
    const q = encodeURIComponent(currentSearchKw);
    let url = '';
    if (platform === 'mercari') {
      url = `https://jp.mercari.com/search?keyword=${q}&status=sold_out&sort=created_time&order=desc`;
    } else if (platform === 'yfurima') {
      url = `https://paypayfleamarket.yahoo.co.jp/search/${q}?isSoldOut=1`;
    } else if (platform === 'yauc') {
      url = `https://auctions.yahoo.co.jp/closedsearch/closedsearch?p=${q}`;
    }
    if (url) window.open(url, '_blank');
  }

  function copyText(elementId) {
    const el = document.getElementById(elementId);
    if (!el || !el.value) return;
    navigator.clipboard.writeText(el.value);
    alert('コピーしました！');
  }
</script>
</body>
</html>
