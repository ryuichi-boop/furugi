<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>古着AIリサーチ＆出品PRO</title>
<style>
:root{--bg:#0b1329;--card:#162033;--border:#1e293b;--txt:#f8fafc;--sub:#94a3b8;--blue:#0284c7;--red:#ef4444}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);padding:14px;line-height:1.5}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{text-align:center;padding:4px 0}
header h1{font-size:1.15rem;color:#38bdf8}
header p{font-size:0.75rem;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center}
.btn{width:100%;padding:11px;border:none;border-radius:8px;font-size:0.85rem;font-weight:700;color:#fff;background:var(--blue);cursor:pointer}
.btn-sm{padding:5px 9px;font-size:0.75rem;background:#334155;color:#fff;border:none;border-radius:6px;cursor:pointer}
.btn-del{background:#7f1d1d;color:#fca5a5}
.ipt{width:100%;background:#0f172a;border:1px solid #334155;color:#fff;padding:9px;border-radius:8px;font-size:0.85rem;outline:none}
.upload{border:2px dashed #334155;border-radius:8px;padding:16px;text-align:center;background:#090e1a;cursor:pointer;color:var(--sub);font-size:0.8rem}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.th-wrap{position:relative;width:60px;height:60px;flex-shrink:0}
.th-img{width:100%;height:100%;border-radius:6px;object-fit:cover;border:1px solid #334155}
.th-x{position:absolute;top:-5px;right:-5px;width:18px;height:18px;background:var(--red);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer}
.log{background:#090e1a;border:1px solid var(--border);border-radius:8px;padding:9px;font-size:0.75rem;color:var(--sub);white-space:pre-wrap}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.box{background:#090e1a;border:1px solid var(--border);border-radius:8px;padding:6px;text-align:center}
.box-t{font-size:0.65rem;color:var(--sub)}
.box-v{font-size:0.8rem;font-weight:700;color:#38bdf8}
.txt-area{width:100%;background:#090e1a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;padding:8px;font-size:0.8rem;min-height:110px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>👕 古着AIリサーチ＆出品PRO</h1>
    <p>画像鑑定・市場査定・メルカリ出品文生成</p>
  </header>

  <section class="card">
    <div class="row">
      <span style="font-size:0.85rem;font-weight:700;">🔑 Gemini API設定</span>
      <button class="btn-sm" onclick="toggleApi()">設定を開く</button>
    </div>
    <div id="apiBox" style="display:none;gap:6px;">
      <input type="text" id="apiKey" class="ipt" placeholder="APIキーを入力">
      <button class="btn-sm" style="background:#0284c7" onclick="saveKey()">保存</button>
    </div>
  </section>

  <section class="card">
    <div class="row">
      <span style="font-size:0.85rem;font-weight:700;">📸 写真の選択 (最大4枚)</span>
      <button id="delAllBtn" class="btn-sm btn-del" style="display:none" onclick="clearPhotos()">全消去</button>
    </div>
    <div class="upload" onclick="document.getElementById('fileIn').click()">
      📷 タップして写真を選択 / 撮影
      <input type="file" id="fileIn" multiple accept="image/*" style="display:none" onchange="loadFiles(this.files)">
    </div>
    <div id="thumbArea" class="thumbs"></div>

    <div style="display:flex;flex-direction:column;gap:4px">
      <span style="font-size:0.72rem;color:var(--sub)">出品トーン（文体）</span>
      <select id="tone" class="ipt">
        <option value="親切・丁寧・誠実（万能・リピート獲得型）">親切・丁寧・誠実（万能・リピート獲得型）</option>
        <option value="シンプル・要点重視（古着好き向け・短文型）">シンプル・要点重視（古着好き向け・短文型）</option>
        <option value="ストリート・ヴィンテージ感（熱量高め・高単価型）">ストリート・ヴィンテージ感（熱量高め・高単価型）</option>
      </select>
    </div>
    <button class="btn" onclick="startAppraisal()">⚡ AI市場査定＆出品文を生成</button>
  </section>

  <div id="log" class="log">待機中...</div>

  <section class="card" id="resCard" style="display:none">
    <div class="row">
      <span style="font-size:0.85rem;font-weight:700;">📊 市場査定データ</span>
      <span id="resBrand" style="color:#38bdf8;font-size:0.8rem"></span>
    </div>
    <div id="resFeatures" style="font-size:0.75rem;background:#090e1a;padding:6px;border-radius:6px"></div>
    <div class="grid">
      <div class="box"><div class="box-t">メルカリ相場</div><div class="box-v" id="pMercari">-</div></div>
      <div class="box"><div class="box-t">Yahoo!フリマ</div><div class="box-v" id="pYfurima">-</div></div>
      <div class="box"><div class="box-t">ヤフオク相場</div><div class="box-v" id="pYauc">-</div></div>
    </div>
    <div class="row" style="font-size:0.72rem;color:var(--sub)">
      <span>推奨送料: <b id="resShip" style="color:#fff">-</b></span>
      <span>検索ワード: <b id="resKw" style="color:#38bdf8">-</b></span>
    </div>
    <div class="grid">
      <button class="btn-sm" style="background:#ea580c" onclick="goSearch('mercari')">メルカリ</button>
      <button class="btn-sm" style="background:#c026d3" onclick="goSearch('yfurima')">Y!フリマ</button>
      <button class="btn-sm" style="background:#ca8a04" onclick="goSearch('yauc')">ヤフオク</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px;margin-top:4px">
      <div class="row"><span style="font-size:0.72rem;color:var(--sub)">メルカリ推奨タイトル</span><button class="btn-sm" onclick="copyVal('outTitle')">コピー</button></div>
      <input type="text" id="outTitle" class="ipt" readonly>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px">
      <div class="row"><span style="font-size:0.72rem;color:var(--sub)">メルカリ商品説明文（ハッシュタグ付き）</span><button class="btn-sm" onclick="copyVal('outDesc')">コピー</button></div>
      <textarea id="outDesc" class="txt-area"></textarea>
    </div>
  </section>
</div>

<script>
let images = [];
let targetKw = '';

function setLog(m){ document.getElementById('log').innerText = m; }
function toggleApi(){ const b = document.getElementById('apiBox'); b.style.display = b.style.display==='none'?'flex':'none'; }
function saveKey(){
  const k = document.getElementById('apiKey').value.trim();
  if(!k) return alert('APIキーを入力してください');
  localStorage.setItem('furugi_gemini_key', k);
  alert('保存しました');
  toggleApi();
}
window.onload = () => {
  const k = localStorage.getItem('furugi_gemini_key') || localStorage.getItem('gemini_api_key') || '';
  if(k) document.getElementById('apiKey').value = k;
};

function optImage(file){
  return new Promise((resolve) => {
    const r = new FileReader();
    r.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const max = 1200;
        if(w > max || h > max){
          if(w > h){ h = Math.round((h * max)/w); w = max; }
          else{ w = Math.round((w * max)/h); h = max; }
        }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        const url = c.toDataURL('image/jpeg', 0.82);
        resolve({ url, b64: url.split(',')[1] });
      };
      img.src = e.target.result;
    };
    r.readAsDataURL(file);
  });
}

async function loadFiles(files){
  if(!files || !files.length) return;
  setLog('⏳ 写真を準備中...');
  for(const f of Array.from(files)){
    if(images.length >= 4) break;
    const res = await optImage(f);
    images.push(res);
  }
  renderThumbs();
  document.getElementById('fileIn').value = '';
}

function renderThumbs(){
  const area = document.getElementById('thumbArea');
  const btn = document.getElementById('delAllBtn');
  area.innerHTML = '';
  if(!images.length){ btn.style.display='none'; setLog('写真を選択してください'); return; }
  btn.style.display = 'inline-block';
  images.forEach((img, i) => {
    const d = document.createElement('div');
    d.className = 'th-wrap';
    d.innerHTML = `<img src="${img.url}" class="th-img"><div class="th-x" onclick="delOne(${i})">×</div>`;
    area.appendChild(d);
  });
  setLog(`${images.length}枚選択中`);
}

function delOne(i){ images.splice(i,1); renderThumbs(); }
function clearPhotos(){ images=[]; renderThumbs(); }

async function startAppraisal(){
  const k = document.getElementById('apiKey').value.trim() || localStorage.getItem('furugi_gemini_key');
  if(!k) return alert('Gemini APIキーを設定してください');
  if(!images.length) return alert('写真を選択してください');

  const tone = document.getElementById('tone').value;
  document.getElementById('resCard').style.display = 'none';

  const prompt = `あなたは古着市場のプロ鑑定士です。画像から査定を行い、必ず以下のJSONのみを出力してください。
【条件】
1. オールドGAP、USA製、銀タグ等は高額査定に上方修正
2. listing_template.descriptionの末尾に、メルカリ検索用ハッシュタグ（#ブランド #カテゴリ #年代ディテール #古着男子 等）を半角スペース区切りで5〜8個必ず含めること
【指定トーン: ${tone}】

{
  "brand": "ブランド名",
  "features": "特徴、査定理由",
  "shipping_fee": 215,
  "search_keyword": "メルカリ売切検索ワード",
  "mercari": {"min_price": 0, "max_price": 0},
  "yahooflea": {"min_price": 0, "max_price": 0},
  "yahooauc": {"min_price": 0, "max_price": 0},
  "listing_template": {
    "title": "SEOメルカリタイトル（40字以内）",
    "description": "商品説明文と末尾ハッシュタグ"
  }
}`;

  const parts = [{ text: prompt }];
  images.forEach(im => parts.push({ inline_data: { mime_type: 'image/jpeg', data: im.b64 } }));

  const models = ['gemini-3.8-flash', 'gemini-3.5-flash'];
  let parsed = null;

  for(const m of models){
    setLog(`🔍 ${m} でAI鑑定中...`);
    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${k}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts }],
          generationConfig: { response_mime_type: "application/json" }
        })
      });
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      let txt = data.candidates?.[0]?.content?.parts?.[0]?.text;
      if(!txt) throw new Error('応答なし');
      txt = txt.replace(/```json/gi,'').replace(/```/g,'').trim();
      const s = txt.indexOf('{'), e = txt.lastIndexOf('}');
      if(s !== -1 && e !== -1) txt = txt.substring(s, e+1);
      parsed = JSON.parse(txt);
      break;
    } catch(err){
      setLog(`⚠️ ${m} 失敗。次を試行...`);
      await new Promise(r => setTimeout(r, 800));
    }
  }

  if(!parsed) return setLog('エラー: 鑑定に失敗しました。少し待って再試行してください');

  document.getElementById('resBrand').innerText = parsed.brand || '';
  document.getElementById('resFeatures').innerText = parsed.features || '';
  document.getElementById('pMercari').innerText = `¥${(parsed.mercari?.min_price||0).toLocaleString()}〜${(parsed.mercari?.max_price||0).toLocaleString()}`;
  document.getElementById('pYfurima').innerText = `¥${(parsed.yahooflea?.min_price||0).toLocaleString()}〜${(parsed.yahooflea?.max_price||0).toLocaleString()}`;
  document.getElementById('pYauc').innerText = `¥${(parsed.yahooauc?.min_price||0).toLocaleString()}〜${(parsed.yahooauc?.max_price||0).toLocaleString()}`;
  document.getElementById('resShip').innerText = `¥${parsed.shipping_fee||215}`;
  targetKw = parsed.search_keyword || parsed.brand || '';
  document.getElementById('resKw').innerText = targetKw;
  document.getElementById('outTitle').value = parsed.listing_template?.title || '';
  document.getElementById('outDesc').value = parsed.listing_template?.description || '';

  document.getElementById('resCard').style.display = 'flex';
  setLog('✨ 査定および出品文の生成完了！');
}

function goSearch(p){
  if(!targetKw) return alert('検索ワードがありません');
  const q = encodeURIComponent(targetKw);
  let u = '';
  if(p==='mercari') u = `https://jp.mercari.com/search?keyword=${q}&status=sold_out&sort=created_time&order=desc`;
  if(p==='yfurima') u = `https://paypayfleamarket.yahoo.co.jp/search/${q}?isSoldOut=1`;
  if(p==='yauc') u = `https://auctions.yahoo.co.jp/closedsearch/closedsearch?p=${q}`;
  if(u) window.open(u, '_blank');
}

function copyVal(id){
  const el = document.getElementById(id);
  if(!el || !el.value) return;
  navigator.clipboard.writeText(el.value);
  alert('コピーしました！');
}
</script>
</body>
</html>
