<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>古着瞬間査定プロ - スピード仕入れ</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #2563eb;
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 12px; font-size: 14px; max-width: 500px; margin: 0 auto; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    h1 { font-size: 16px; font-weight: bold; }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    
    /* APIキー設定 */
    .api-sec { display: flex; gap: 8px; align-items: center; }
    .api-sec input {
      flex: 1; padding: 8px; background: #0f172a; border: 1px solid var(--border);
      border-radius: 6px; color: #fff; font-size: 14px;
    }
    .btn-save { padding: 8px 12px; background: var(--accent); color: white; border: none; border-radius: 6px; font-weight: bold; }

    /* 撮影セクション */
    .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .photo-slot {
      border: 2px dashed var(--border); border-radius: 8px; padding: 10px;
      text-align: center; background: #131d31; cursor: pointer; position: relative;
    }
    .photo-slot.ready { border-color: var(--success); background: #064e3b22; }
    .photo-slot img { width: 100%; height: 110px; object-fit: cover; border-radius: 6px; display: none; margin-bottom: 6px; }
    .photo-label { font-size: 13px; font-weight: bold; display: block; margin-bottom: 4px; }
    .photo-status { font-size: 11px; color: var(--text-sub); }
    .photo-slot.ready .photo-status { color: #4ade80; font-weight: bold; }
    input[type="file"] { display: none; }

    /* 値札・実行 */
    .price-box { margin-bottom: 12px; }
    .price-box label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 4px; }
    .price-box input {
      width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border);
      border-radius: 6px; color: #fff; font-size: 18px; font-weight: bold;
    }

    .btn-satei {
      width: 100%; padding: 14px; background: var(--success); color: white;
      border: none; border-radius: 8px; font-size: 16px; font-weight: bold;
      cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .btn-satei:disabled { background: var(--border); color: var(--text-sub); cursor: not-allowed; }

    /* 判定結果 */
    #result-sec { display: none; margin-top: 12px; }
    .judgment-banner {
      padding: 12px; border-radius: 8px; text-align: center;
      font-size: 20px; font-weight: 900; margin-bottom: 12px;
    }
    .buy { background: #15803d; color: white; }
    .skip { background: #b91c1c; color: white; }
    .careful { background: #b45309; color: white; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .data-pill { background: #0f172a; padding: 8px; border-radius: 6px; border: 1px solid var(--border); }
    .data-pill span { display: block; font-size: 11px; color: var(--text-sub); }
    .data-pill strong { font-size: 15px; color: #fff; }

    .reason-box { background: #0f172a; padding: 10px; border-radius: 6px; border: 1px solid var(--border); font-size: 13px; line-height: 1.5; }
    .loading-spinner { text-align: center; padding: 20px; color: var(--text-sub); display: none; }
  </style>
</head>
<body>

  <header>
    <h1>⚡ 古着瞬間査定プロ</h1>
    <span style="font-size:11px; color:#94a3b8;">純正カメラ連携</span>
  </header>

  <!-- APIキー設定（伏字・非表示対応） -->
  <div class="card">
    <div style="font-size:11px; color:var(--text-sub); margin-bottom:4px;">🔑 Gemini APIキー設定</div>
    <div class="api-sec">
      <input type="password" id="apiKey" placeholder="••••••••••••••••••••">
      <button class="btn-save" onclick="saveKey()">保存</button>
    </div>
    <div id="key-msg" style="font-size:11px; color:#4ade80; margin-top:4px; display:none;">✔ キー保存済み</div>
  </div>

  <!-- 写真撮影（タップで純正カメラ起動・広角撮影可能） -->
  <div class="photo-grid">
    <label class="photo-slot" id="slot-overall">
      <span class="photo-label">📸 ① 全体写真</span>
      <img id="img-overall" alt="全体写真">
      <span class="photo-status" id="status-overall">タップして撮影（広角OK）</span>
      <input type="file" id="file-overall" accept="image/*" capture="environment" onchange="handleFile(this, 'overall')">
    </label>

    <label class="photo-slot" id="slot-tag">
      <span class="photo-label">📸 ② タグ写真</span>
      <img id="img-tag" alt="タグ写真">
      <span class="photo-status" id="status-tag">タップして撮影（ピント合わせ）</span>
      <input type="file" id="file-tag" accept="image/*" capture="environment" onchange="handleFile(this, 'tag')">
    </label>
  </div>

  <!-- 仕入れ価格入力 -->
  <div class="card price-box">
    <label for="cost">店頭値札価格（円）</label>
    <input type="number" id="cost" placeholder="例: 900" inputmode="numeric">
  </div>

  <!-- 査定ボタン -->
  <button class="btn-satei" id="btn-submit" onclick="executeSatei()">🔍 瞬間相場・仕入れ判定</button>

  <div class="loading-spinner" id="loading">
    ⏳ AIが相場照合・利益計算中...
  </div>

  <!-- 結果表示 -->
  <div id="result-sec" class="card">
    <div class="judgment-banner" id="res-banner">---</div>

    <div class="grid-2">
      <div class="data-pill">
        <span>想定売価（相場）</span>
        <strong id="res-market">¥ -</strong>
      </div>
      <div class="data-pill">
        <span>見込み純利益</span>
        <strong id="res-profit">¥ -</strong>
      </div>
    </div>

    <div class="grid-2">
      <div class="data-pill">
        <span>特定ブランド / 年代</span>
        <strong id="res-brand" style="font-size:13px;">-</strong>
      </div>
      <div class="data-pill">
        <span>回転速度（売りやすさ）</span>
        <strong id="res-speed">-</strong>
      </div>
    </div>

    <div class="reason-box" id="res-reason" style="margin-top:8px;">
      判定理由がここに表示されます。
    </div>
  </div>

  <script>
    let overallBase64 = null;
    let tagBase64 = null;

    window.onload = () => {
      const savedKey = localStorage.getItem('gemini_api_key') || '';
      if (savedKey) {
        document.getElementById('apiKey').value = savedKey;
        document.getElementById('key-msg').style.display = 'block';
      }
    };

    function saveKey() {
      const val = document.getElementById('apiKey').value.trim();
      if (!val) { alert('APIキーを入力してください'); return; }
      localStorage.setItem('gemini_api_key', val);
      document.getElementById('key-msg').style.display = 'block';
      alert('APIキーを端末内に安全に保存しました！');
    }

    // 画像圧縮処理（高速化・容量削減）
    function handleFile(input, type) {
      if (!input.files || !input.files[0]) return;
      const file = input.files[0];
      const reader = new FileReader();

      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 800; // 最適な解像度に縮小
          let w = img.width, h = img.height;
          if (w > h && w > maxDim) { h = (h * maxDim) / w; w = maxDim; }
          else if (h > maxDim) { w = (w * maxDim) / h; h = maxDim; }

          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
          const base64Data = dataUrl.split(',')[1];

          if (type === 'overall') {
            overallBase64 = base64Data;
            document.getElementById('img-overall').src = dataUrl;
            document.getElementById('img-overall').style.display = 'block';
            document.getElementById('status-overall').innerText = '✔ 全体画像 登録済';
            document.getElementById('slot-overall').classList.add('ready');
          } else {
            tagBase64 = base64Data;
            document.getElementById('img-tag').src = dataUrl;
            document.getElementById('img-tag').style.display = 'block';
            document.getElementById('status-tag').innerText = '✔ タグ画像 登録済';
            document.getElementById('slot-tag').classList.add('ready');
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function executeSatei() {
      const key = localStorage.getItem('gemini_api_key');
      if (!key) { alert('先にAPIキーを保存してください'); return; }
      if (!overallBase64) { alert('① 全体写真を撮影してください'); return; }

      const costVal = parseInt(document.getElementById('cost').value, 10) || 0;
      const loading = document.getElementById('loading');
      const resSec = document.getElementById('result-sec');
      const btn = document.getElementById('btn-submit');

      btn.disabled = true;
      loading.style.display = 'block';
      resSec.style.display = 'none';

      const prompt = `あなたはメルカリ古着せどりのトッププロ査定員です。
提供された古着の写真（1枚目: 全体, 2枚目: ブランド/品質表示タグ）と店頭値札価格（${costVal}円）をもとに、瞬時に仕入れ判断を行ってください。

【必須出力フォーマット】
以下のJSON形式のみで回答してください。余計な挨拶やコードブロックは一切含めないでください。
{
  "judgment": "仕入れ推奨" または "見送り" または "慎重判断",
  "marketPrice": 3500,
  "profit": 1850,
  "brandEra": "Ralph Lauren / 90s三角タグ",
  "speed": "即売れ(3日以内)" または "普通(2週間)" または "長期化懸念",
  "reason": "相場、需要、利益が取れる/取れない理由を簡潔に2行以内で記述"
}

※純利益の計算式：想定売価 × 0.9 - 送料(厚みに応じて215円〜750円) - 店頭値札価格(${costVal}円)`;

      const parts = [{ text: prompt }];
      parts.push({
        inlineData: { mimeType: "image/jpeg", data: overallBase64 }
      });
      if (tagBase64) {
        parts.push({
          inlineData: { mimeType: "image/jpeg", data: tagBase64 }
        });
      }

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts }] })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        let text = data.candidates[0].content.parts[0].text;
        text = text.replace(/```json/g, '').replace(/```/g, '').trim();
        const parsed = JSON.parse(text);

        // 結果反映
        const banner = document.getElementById('res-banner');
        banner.innerText = parsed.judgment;
        banner.className = 'judgment-banner ' + 
          (parsed.judgment.includes('推奨') ? 'buy' : parsed.judgment.includes('見送り') ? 'skip' : 'careful');

        document.getElementById('res-market').innerText = `¥ ${Number(parsed.marketPrice).toLocaleString()}`;
        document.getElementById('res-profit').innerText = `¥ ${Number(parsed.profit).toLocaleString()}`;
        document.getElementById('res-brand').innerText = parsed.brandEra || '不明';
        document.getElementById('res-speed').innerText = parsed.speed || '不明';
        document.getElementById('res-reason').innerText = parsed.reason;

        resSec.style.display = 'block';
      } catch (err) {
        alert('査定エラーが発生しました: ' + err.message);
      } finally {
        loading.style.display = 'none';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
