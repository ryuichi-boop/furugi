<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>古着瞬間査定 PRO</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --primary: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      line-height: 1.5;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    h1 { font-size: 1.25rem; font-weight: 700; color: var(--primary); }
    .btn-key {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .input-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input[type="number"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text);
      font-size: 1.1rem;
      font-weight: 700;
      outline: none;
    }
    .photo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    .photo-box {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 16px 8px;
      text-align: center;
      cursor: pointer;
      position: relative;
      background: var(--bg);
      min-height: 130px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .photo-box.has-img {
      border-style: solid;
      border-color: var(--primary);
      padding: 0;
      overflow: hidden;
    }
    .photo-box img {
      width: 100%;
      height: 130px;
      object-fit: cover;
    }
    .photo-box span {
      font-size: 0.8rem;
      color: var(--muted);
    }
    input[type="file"] { display: none; }
    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #resultCard {
      display: none;
    }
    .verdict-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 1.1rem;
      margin-bottom: 12px;
      text-align: center;
      width: 100%;
    }
    .verdict-buy { background: rgba(34, 197, 94, 0.2); color: var(--success); border: 1px solid var(--success); }
    .verdict-skip { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }
    .verdict-caution { background: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid var(--warning); }
    .price-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding: 8px 0;
      font-size: 0.95rem;
    }
    .price-val { font-weight: 700; color: var(--primary); }
    .profit-val { font-weight: 700; color: var(--success); }
    .reason-box {
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text);
      white-space: pre-wrap;
      background: var(--bg);
      padding: 12px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ 古着瞬間査定 PRO</h1>
    <button class="btn-key" onclick="setApiKey()">🔑 APIキー設定</button>
  </header>

  <div class="card">
    <div class="input-group">
      <label for="storePrice">店頭価格 (税込・円)</label>
      <input type="number" id="storePrice" placeholder="例: 1500" inputmode="numeric">
    </div>

    <div class="photo-grid">
      <div class="photo-box" id="boxItem" onclick="document.getElementById('fileItem').click()">
        <span id="labelItem">📸 全体写真<br>(前・デザイン)</span>
        <img id="imgItem" style="display:none;">
      </div>
      <input type="file" id="fileItem" accept="image/*" capture="environment" onchange="handleImage(this, 'imgItem', 'labelItem', 'boxItem')">

      <div class="photo-box" id="boxTag" onclick="document.getElementById('fileTag').click()">
        <span id="labelTag">🏷️ タグ写真<br>(ブランド・品質表示)</span>
        <img id="imgTag" style="display:none;">
      </div>
      <input type="file" id="fileTag" accept="image/*" capture="environment" onchange="handleImage(this, 'imgTag', 'labelTag', 'boxTag')">
    </div>

    <button class="btn-submit" id="btnSatei" onclick="runAssessment()">瞬間査定を実行</button>
  </div>

  <div class="card" id="resultCard">
    <div id="verdictBadge" class="verdict-badge">判定中...</div>
    <div class="price-row">
      <span>想定売価 (メルカリ)</span>
      <span class="price-val" id="resEstPrice">-</span>
    </div>
    <div class="price-row">
      <span>見込純利益</span>
      <span class="profit-val" id="resProfit">-</span>
    </div>
    <div class="reason-box" id="resReason"></div>
  </div>

  <script>
    let itemBase64 = null;
    let tagBase64 = null;

    function setApiKey() {
      const currentKey = localStorage.getItem('GEMINI_API_KEY') || localStorage.getItem('furugi_k') || '';
      const key = prompt('Google Gemini API Key を入力してください:', currentKey);
      if (key !== null) {
        localStorage.setItem('GEMINI_API_KEY', key.trim());
        localStorage.setItem('furugi_k', key.trim());
        alert('APIキーをブラウザ内に安全に保存しました');
      }
    }

    function compressImage(file, callback) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const maxDim = 800;
          let width = img.width;
          let height = img.height;
          if (width > height) {
            if (width > maxDim) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            }
          } else {
            if (height > maxDim) {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          callback(canvas.toDataURL('image/jpeg', 0.75).split(',')[1]);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function handleImage(input, imgId, labelId, boxId) {
      if (!input.files || !input.files[0]) return;
      const file = input.files[0];
      compressImage(file, function(b64) {
        if (imgId === 'imgItem') itemBase64 = b64;
        if (imgId === 'imgTag') tagBase64 = b64;
        const img = document.getElementById(imgId);
        img.src = "data:image/jpeg;base64," + b64;
        img.style.display = 'block';
        document.getElementById(labelId).style.display = 'none';
        document.getElementById(boxId).classList.add('has-img');
      });
    }

    async function runAssessment() {
      const apiKey = localStorage.getItem('GEMINI_API_KEY') || localStorage.getItem('furugi_k');
      if (!apiKey) {
        alert('APIキーが設定されていません。右上の「APIキー設定」から登録してください。');
        return;
      }
      const storePrice = parseInt(document.getElementById('storePrice').value, 10);
      if (isNaN(storePrice) || storePrice < 0) {
        alert('店頭価格を入力してください');
        return;
      }
      if (!itemBase64 && !tagBase64) {
        alert('写真を少なくとも1枚（全体またはタグ）撮影してください');
        return;
      }

      const btn = document.getElementById('btnSatei');
      btn.disabled = true;
      btn.innerText = '査定中... (AI分析中)';

      const resultCard = document.getElementById('resultCard');
      resultCard.style.display = 'block';
      const badge = document.getElementById('verdictBadge');
      badge.className = 'verdict-badge';
      badge.innerText = '解析中...';
      document.getElementById('resEstPrice').innerText = '計算中';
      document.getElementById('resProfit').innerText = '計算中';
      document.getElementById('resReason').innerText = '相場・タグディテール照合中...';

      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonth = now.getMonth() + 1;

      const promptText = `
【あなたの役割】
あなたは月利100万円以上を継続して叩き出す、冷徹かつ極めて鑑定眼の鋭い「ヴィンテージ古着専業バイヤー兼メルカリ相場アナリスト」です。
古着業界の歴史、タグの年代判別（50s〜00s）、素材・縫製仕様、メルカリの成約スピードを骨の髄まで熟知しています。

【基本方針】
1. 「計算の厳格な客観性」: 見込純利益は数式に従って正確に算出して出力すること（見送りの場合でも0円に改ざんしないこと）。
2. 「ディテール・実需重視」: 有名ブランド名に惑わされず、タグ・生産国・年代・ディテール・状態、およびメルカリ上のリアルな回転スピードをシビアに評価せよ。

【現在時点】: ${currentYear}年${currentMonth}月
【店頭仕入れ価格】: ${storePrice}円

【ブランド別 高速タグ・年代判定辞書】
・Eddie Bauer：日の出タグ(50-60s)、黒タグ(70-80s)、白タグUSA製のみ回収。現行緑タグは除外。
・GAP：小文字gap(70-80s)、銀タグ、90s紺タグ/白タグ(首元小タグ付属)のみ回収。脇腹洗濯タグの現行品は除外。
・UNIQLO：オールドユニクロ初期タグ(UNIQUE表記/緑タグ)、90s銀タグ(フリース/アウター)、00s紺タグテック系のみ回収。丸タグ/現行赤白タグは除外。
・Patagonia：白タグ(70s)、デカタグ/三角タグ(80s)、雪なしタグ/波タグ(90s前半)、USA製(®マーク)のみ回収。薄手インナーは除外。
・Ralph Lauren：RRL、ポロカントリー、70s大文字、ポロスポーツ、開襟シャツ(CALDWELL/CLAYTON/CAMP)、90sビッグ(BLAKE/ANDREW)のみ回収。薄手ビジネスシャツ/現行ポロは除外。
・NIKE：風車・筆記体・オレンジタグ・紺タグ(70-80s)、90s銀タグ、旧ACGのみ回収。現行プリントタグ/薄手ウェアは除外。
・Champion：ランタグ・バータグ・たたきタグ(〜70s)、トリコタグ(80s)、90s USA製刺繍タグのリバースウィーブのみ回収。通常アジア製スウェットは除外。
・Carhartt：ハートタグ・プリント白タグ(〜70s)、USA/メキシコ製のダックアウター(デトロイトJ97/アクティブ/ダブルニーB01)のみ回収。薄手ポケT/現行アジア製は除外。
・adidas：西ドイツ製/フランス製VENTEX、デサント製トラックJKT、80-90s万国旗タグのみ回収。NEO/現行部活ジャージは除外。
・L.L.Bean：筆記体タグ、70sブロック体TM表記、カタディンロゴ、バーズアイニット、USA製アウターのみ回収。現行アジア製薄手シャツは除外。
・THE NORTH FACE：茶タグ(70-80s)、90s USA製黒タグ(ヌプシ/マウンテンライト/デナリ)、SUMMITシリーズのみ回収。韓国ホワイトレーベル/薄手Tシャツは除外。
・Levi's：Big E、赤耳、内股シングル、80-90s USA製(ボタン裏3桁刻印/ブラックデニム)、SilverTabのみ回収。現行アジア製は除外。

【計算ロジック（厳密計算）】
- メルカリ販売手数料: 想定売価 × 10%
- 想定送料: Tシャツ・薄手シャツ等は220円、スウェット・厚手パンツ・アウター等は520円〜750円
- 見込純利益 = 想定売価 - 手数料 - 想定送料 - 店頭仕入れ価格(${storePrice}円)

【判定基準（verdict）】
- 「買い」: ヴィンテージ・プレ値ディテールに合致し、純利益1,500円以上かつ利益率35%以上で即売れが見込める場合。
- 「慎重」: 利益は500円以上出るが、現行量産品、供給過多で回転が遅い恐れがある、または純利益が500円〜1,499円にとどまる場合。
- 「見送り」: 純利益が500円未満、赤字、または需要低迷・送料負けのリスクが極めて高い場合。

必ず以下のJSON形式のみで出力してください:
{
  "verdict": "買い",
  "estimatedPrice": 6500,
  "estimatedProfit": 3600,
  "reason": "ブランド・年代・ディテール評価と、純利益および判定理由の客観的解説（100字程度）"
}
`;

      const parts = [{ text: promptText }];
      if (itemBase64) parts.push({ inlineData: { mimeType: "image/jpeg", data: itemBase64 } });
      if (tagBase64) parts.push({ inlineData: { mimeType: "image/jpeg", data: tagBase64 } });

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: parts }],
            generationConfig: { responseMimeType: "application/json" }
          })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => null);
          throw new Error(errData?.error?.message || `HTTP ${response.status}`);
        }

        const data = await response.json();
        let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!rawText) throw new Error('AIからの応答が空でした');

        // 安全なJSON抽出処理（前後の余計なテキストを確実にカット）
        const jsonMatch = rawText.match(/\{[\s\S]*\}/);
        if (!jsonMatch) throw new Error('JSONの解析に失敗しました');
        const res = JSON.parse(jsonMatch[0]);

        if (res.verdict === '買い') {
          badge.className = 'verdict-badge verdict-buy';
          badge.innerText = '🔥 仕入れ推奨 (買い)';
        } else if (res.verdict === '慎重') {
          badge.className = 'verdict-badge verdict-caution';
          badge.innerText = '⚠️ 慎重判断 (薄利・回転注意)';
        } else {
          badge.className = 'verdict-badge verdict-skip';
          badge.innerText = '⛔ 見送り (スルー)';
        }

        document.getElementById('resEstPrice').innerText = Number(res.estimatedPrice).toLocaleString() + ' 円';
        document.getElementById('resProfit').innerText = Number(res.estimatedProfit).toLocaleString() + ' 円';
        document.getElementById('resReason').innerText = res.reason;

      } catch (err) {
        badge.className = 'verdict-badge verdict-skip';
        badge.innerText = 'エラー発生';
        document.getElementById('resReason').innerText = err.message + '\n※APIキーや通信環境をご確認ください。';
      } finally {
        btn.disabled = false;
        btn.innerText = '瞬間査定を実行';
      }
    }
  </script>
</body>
</html>
