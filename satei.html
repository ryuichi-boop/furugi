<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>古着瞬間査定Pro Lite</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #ef4444;
      --primary: #2563eb;
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --green: #22c55e;
      --yellow: #eab308;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: var(--bg-color);
      color: var(--text);
      padding: 16px;
      padding-bottom: 60px;
    }

    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #334155;
    }
    header h1 { font-size: 1.15rem; font-weight: 700; }
    .btn-icon { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: var(--text); }

    /* メインの写真投入ボタン */
    .upload-zone {
      background: var(--card-bg); border: 2px dashed #475569; border-radius: 16px;
      padding: 32px 16px; text-align: center; cursor: pointer; display: block;
      transition: border-color 0.2s;
    }
    .upload-zone:active { border-color: var(--primary); }
    .upload-zone span { font-size: 2.2rem; display: block; margin-bottom: 8px; }
    .upload-zone strong { font-size: 1.1rem; display: block; margin-bottom: 4px; }
    .upload-zone p { font-size: 0.8rem; color: var(--text-sub); }

    /* プレビュー画像 */
    .preview-bar {
      display: flex; gap: 8px; margin-top: 14px; overflow-x: auto;
    }
    .preview-img {
      width: 70px; height: 70px; border-radius: 8px; object-fit: cover; border: 1px solid #334155;
    }

    /* 査定結果カード */
    .result-card {
      margin-top: 20px; background: var(--card-bg); border-radius: 16px;
      padding: 18px; border: 1px solid #334155; display: none;
    }
    .badge-verdict {
      display: inline-block; padding: 6px 14px; border-radius: 6px;
      font-weight: 800; font-size: 1rem; margin-bottom: 10px;
    }
    .badge-buy { background: rgba(34, 197, 94, 0.2); color: var(--green); border: 1px solid var(--green); }
    .badge-cond { background: rgba(234, 179, 8, 0.2); color: var(--yellow); border: 1px solid var(--yellow); }
    .badge-pass { background: rgba(239, 68, 68, 0.2); color: var(--accent); border: 1px solid var(--accent); }

    /* メルカリ直行枠 */
    .mercari-box {
      margin: 14px 0; padding: 12px; background: #0f172a; border-radius: 8px; border: 1px solid #334155;
    }
    .btn-mercari {
      display: block; width: 100%; background: #e11d48; color: #fff; text-align: center;
      padding: 12px; border-radius: 8px; font-weight: bold; text-decoration: none; font-size: 0.95rem;
    }
    .btn-copy-kw {
      width: 100%; margin-top: 8px; padding: 8px; background: #334155; color: var(--text-sub);
      border: none; border-radius: 6px; font-size: 0.75rem; cursor: pointer;
    }

    /* 相場グリッド */
    .price-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; background: #0f172a;
      padding: 12px; border-radius: 8px;
    }
    .price-cell span { display: block; font-size: 0.75rem; color: var(--text-sub); margin-bottom: 2px; }
    .price-cell strong { font-size: 1.2rem; }

    /* 後入れ店頭価格 */
    .instore-box { background: #0f172a; padding: 12px; border-radius: 8px; margin: 12px 0; }
    .instore-box input {
      width: 100%; padding: 10px; background: #1e293b; border: 1px solid #475569;
      border-radius: 6px; color: #fff; font-size: 1.1rem; margin-top: 4px; outline: none;
    }
    .profit-output { margin-top: 8px; font-weight: bold; font-size: 0.95rem; }

    /* 技術介入カード */
    .tech-box {
      background: rgba(37, 99, 235, 0.1); border-left: 3px solid var(--primary);
      padding: 12px; border-radius: 4px; margin: 12px 0; font-size: 0.85rem;
    }
    .tech-item { margin-top: 6px; }
    .tech-label { font-weight: bold; color: #60a5fa; }

    /* ローダー＆モーダル */
    .loader {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      justify-content: center; align-items: center; flex-direction: column; z-index: 300;
    }
    .spinner {
      width: 44px; height: 44px; border: 4px solid #334155; border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      justify-content: center; align-items: center; z-index: 400; padding: 16px;
    }
    .modal-content { background: var(--card-bg); width: 100%; max-width: 360px; padding: 20px; border-radius: 12px; }
    .modal-content input {
      width: 100%; padding: 10px; margin: 12px 0; background: #0f172a; border: 1px solid #475569;
      color: #fff; border-radius: 6px;
    }
    .modal-content button {
      width: 100%; padding: 10px; background: var(--primary); color: #fff; border: none; border-radius: 6px; font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>古着瞬間査定Pro Lite</h1>
    <button class="btn-icon" onclick="openKeyModal()">⚙️</button>
  </header>

  <!-- 写真選択エリア（タップでアルバム起動・複数選択可能） -->
  <label class="upload-zone">
    <span>📸</span>
    <strong>写真を選んで即査定</strong>
    <p>「全体」と「タグ」の2枚をまとめて選択（1枚でも可）</p>
    <input type="file" id="imageInput" accept="image/*" multiple style="display:none;" onchange="handleImages(event)">
  </label>

  <!-- 選択した画像のサムネイル一覧 -->
  <div class="preview-bar" id="previewBar"></div>

  <!-- 査定結果カード -->
  <div class="result-card" id="resultCard">
    <div id="resBadge" class="badge-verdict">査定中...</div>
    <div id="resItemName" style="font-weight:bold; font-size:1.1rem; margin-bottom:4px;">-</div>
    <div id="resTagInfo" style="font-size:0.8rem; color:var(--text-sub); margin-bottom:12px;">-</div>

    <!-- メルカリ直行リンク -->
    <div class="mercari-box">
      <a href="#" target="_blank" id="btnMercariLink" class="btn-mercari">🔍 メルカリ売り切れ相場を見る</a>
      <button class="btn-copy-kw" id="btnCopyKw" onclick="copyMercariQuery()">キーワードをコピー</button>
    </div>

    <!-- 価格サマリー -->
    <div class="price-grid">
      <div class="price-cell">
        <span>手堅い下限想定売価</span>
        <strong id="resConservativePrice">¥0</strong>
      </div>
      <div class="price-cell">
        <span>推奨仕入れ上限</span>
        <strong id="resMaxBuyPrice" style="color:var(--green);">¥0 以下</strong>
      </div>
    </div>

    <!-- 後入れ店頭価格再計算 -->
    <div class="instore-box">
      <label style="font-size:0.75rem; color:var(--text-sub);">店頭値札の価格を入力（自動で純利益を計算）</label>
      <input type="number" id="inStorePriceInput" placeholder="例: 1320" oninput="recalcProfit()">
      <div class="profit-output" id="profitOutputText"></div>
    </div>

    <!-- 技術介入カード -->
    <div class="tech-box">
      <strong>🛠️ あなたの技術で化けるポイント:</strong>
      <div class="tech-item"><span class="tech-label">【タイトルSEO】</span><div id="techSeo" style="color:#fff; margin-top:2px;">-</div></div>
      <div class="tech-item"><span class="tech-label">【撮影・見せ方】</span><div id="techStyling" style="color:#cbd5e1; margin-top:2px;">-</div></div>
      <div class="tech-item"><span class="tech-label">【15分メンテ】</span><div id="techMaint" style="color:#cbd5e1; margin-top:2px;">-</div></div>
    </div>

    <p id="resReason" style="font-size:0.75rem; color:var(--text-sub); margin-top:10px; line-height:1.4;"></p>
  </div>

  <!-- APIキーモーダル -->
  <div class="modal" id="keyModal">
    <div class="modal-content">
      <h3>Gemini APIキー設定</h3>
      <p style="font-size:0.75rem; color:var(--text-sub); margin-top:4px;">Google AI StudioのAPIキーを入力してください。</p>
      <input type="password" id="apiKeyInput" placeholder="AIzaSy...">
      <button onclick="saveApiKey()">保存して閉じる</button>
    </div>
  </div>

  <!-- ローディング -->
  <div class="loader" id="loader">
    <div class="spinner"></div>
    <div style="font-weight:bold; font-size:0.9rem;">画像を解析して査定中...</div>
  </div>

  <script>
    let currentValuation = null;
    let mercariQuery = '';

    window.addEventListener('DOMContentLoaded', () => {
      if (!localStorage.getItem('gemini_api_key')) openKeyModal();
    });

    function openKeyModal() {
      document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_api_key') || '';
      document.getElementById('keyModal').style.display = 'flex';
    }
    function saveApiKey() {
      const val = document.getElementById('apiKeyInput').value.trim();
      if (val) localStorage.setItem('gemini_api_key', val);
      document.getElementById('keyModal').style.display = 'none';
    }

    // 画像リサイズ＆Base64化
    function processImageFile(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxDim = 900;
            let w = img.width, h = img.height;
            if (w > h && w > maxDim) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else if (h > maxDim) { w = Math.round((w * maxDim) / h); h = maxDim; }
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.85).split(',')[1]);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // 画像選択時の処理
    async function handleImages(event) {
      const files = event.target.files;
      if (!files || files.length === 0) return;

      const apiKey = localStorage.getItem('gemini_api_key');
      if (!apiKey) return openKeyModal();

      // プレビュー表示
      const previewBar = document.getElementById('previewBar');
      previewBar.innerHTML = '';
      const base64List = [];

      for (let file of files) {
        const url = URL.createObjectURL(file);
        const img = document.createElement('img');
        img.src = url;
        img.className = 'preview-img';
        previewBar.appendChild(img);
        
        const b64 = await processImageFile(file);
        base64List.push(b64);
      }

      await executeAssessment(base64List);
    }

    // 査定API呼び出し
    async function executeAssessment(base64List) {
      const apiKey = localStorage.getItem('gemini_api_key');
      document.getElementById('loader').style.display = 'flex';

      const prompt = `
あなたは古着専業の極めてシビアなトップバイヤーです。
提供された画像（全体・タグ等）を分析し、メルカリ相場を査定してください。

【査定ルール】
1. 画像から服のアイテム種別（ジャケット、シャツ、スウェット等）、色、シルエット、柄、ブランド、年代、サイズを自動判別せよ。
2. デザイン価値を相場に正しく反映させること（例: 黒ハイネックトラックジャケットや企業モノシャツをノーブランドや学校体操服と同列に扱うな）。
3. 最悪ケース基準（Defensive Pricing）: 並品古着として無理のない手堅い下限メルカリ売価（conservative_price）を算出せよ。
4. 推奨上限仕入れ値: conservative_price * 0.9 - 送料(アイテムに応じ220〜850) - 利益1500円。
5. 判定（verdict）: '即買い' | '要確認' | '見送り'
6. mercari_search_query: メルカリで相場を特定できる最も精度の高いキーワード（3〜4単語）。
7. technical_intervention: 15分以内の工夫で売価を引き上げる具体策（タイトルSEO、見せ方、15分メンテ）を出力せよ。

以下の純粋なJSONのみ出力せよ（マークダウンのバッククォート不要）:
{
  "brand": "ブランド名",
  "era": "年代",
  "item_name": "服の特徴名（例: 90s 日本製 トラックジャケット 黒）",
  "size_raw": "タグ表記",
  "size_japan": "換算サイズ",
  "conservative_price": 5000,
  "max_buy_price": 2000,
  "expected_shipping": 520,
  "verdict": "即買い",
  "mercari_search_query": "asics トラックジャケット 90s 日本製",
  "technical_intervention": {
    "seo_title": "即戦力タイトル35字",
    "styling": "撮影・見せ方のアドバイス",
    "maintenance": "15分メンテ方法"
  },
  "reason": "判断根拠"
}`;

      const contentsParts = [{ text: prompt }];
      base64List.forEach(b64 => {
        contentsParts.push({ inline_data: { mime_type: "image/jpeg", data: b64 } });
      });

      try {
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: contentsParts }] })
        });

        const json = await res.json();
        let rawText = json.candidates[0].content.parts[0].text;
        rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
        currentValuation = JSON.parse(rawText);

        renderResult(currentValuation);
      } catch (err) {
        alert("査定エラー: " + err.message);
      } finally {
        document.getElementById('loader').style.display = 'none';
        // ファイル選択の値をリセットして同じ写真でも再選択可能にする
        document.getElementById('imageInput').value = '';
      }
    }

    function renderResult(data) {
      const card = document.getElementById('resultCard');
      card.style.display = 'block';

      const badge = document.getElementById('resBadge');
      badge.textContent = data.verdict;
      badge.className = 'badge-verdict ' + (
        data.verdict === '即買い' ? 'badge-buy' :
        data.verdict === '要確認' ? 'badge-cond' : 'badge-pass'
      );

      document.getElementById('resItemName').textContent = data.item_name || `${data.brand} (${data.era})`;
      document.getElementById('resTagInfo').textContent = `${data.brand} | ${data.era} | 表記:${data.size_raw} (${data.size_japan})`;

      document.getElementById('resConservativePrice').textContent = `¥${data.conservative_price.toLocaleString()}`;
      document.getElementById('resMaxBuyPrice').textContent = `¥${data.max_buy_price.toLocaleString()} 以下`;

      // メルカリ直行リンク
      mercariQuery = data.mercari_search_query || `${data.brand} ${data.item_name}`;
      const mercariUrl = `https://jp.mercari.com/search?keyword=${encodeURIComponent(mercariQuery)}&status=sold_out|trading`;
      document.getElementById('btnMercariLink').href = mercariUrl;

      // 技術介入
      const tech = data.technical_intervention || {};
      document.getElementById('techSeo').textContent = tech.seo_title || '-';
      document.getElementById('techStyling').textContent = tech.styling || '-';
      document.getElementById('techMaint').textContent = tech.maintenance || '-';

      document.getElementById('resReason').textContent = data.reason || '';

      document.getElementById('inStorePriceInput').value = '';
      document.getElementById('profitOutputText').textContent = '';

      card.scrollIntoView({ behavior: 'smooth' });
    }

    function copyMercariQuery() {
      if (!mercariQuery) return;
      navigator.clipboard.writeText(mercariQuery);
      const btn = document.getElementById('btnCopyKw');
      btn.textContent = 'コピー完了！';
      setTimeout(() => { btn.textContent = 'キーワードをコピー'; }, 2000);
    }

    function recalcProfit() {
      if (!currentValuation) return;
      const inStore = parseFloat(document.getElementById('inStorePriceInput').value);
      const out = document.getElementById('profitOutputText');
      if (isNaN(inStore) || inStore <= 0) {
        out.textContent = '';
        return;
      }
      const sell = currentValuation.conservative_price;
      const fee = Math.floor(sell * 0.10);
      const shipping = currentValuation.expected_shipping || 520;
      const profit = sell - fee - shipping - inStore;
      const margin = ((profit / sell) * 100).toFixed(1);

      if (profit > 0) {
        out.style.color = 'var(--green)';
        out.textContent = `想定純利益: +¥${profit.toLocaleString()} (利益率: ${margin}%)`;
      } else {
        out.style.color = 'var(--accent)';
        out.textContent = `赤字リスク: ¥${profit.toLocaleString()} (利益率: ${margin}%)`;
      }
    }
  </script>
</body>
</html>
